name: Fix UPI and verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing expected text in {path}: {old!r}')
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          replace('src/components/payments/upi-payment-dialog.tsx', [
              ('import { useState } from "react";', 'import { useState } from "react";\nimport { EXTROVERT_UPI_ID } from "@/lib/upi";'),
              ('  function copyUpi() {\n    void navigator.clipboard?.writeText("gauravbhardwaj7489@okaxis");', '  function copyUpi() {\n    void navigator.clipboard?.writeText(EXTROVERT_UPI_ID);'),
              ('                gauravbhardwaj7489@okaxis\n', '                {EXTROVERT_UPI_ID.replace(/(.{3}).+(@.+)/, "$1••••$2")}\n'),
              ('      setUpiUrl(data.upiUrl);\n', '      setUpiUrl(data.upiUrl);\n      // Trigger the native UPI intent immediately on supported mobile browsers.\n      // The visible fallback button remains available when the browser blocks deep links.\n      if (data.upiUrl) window.location.assign(data.upiUrl);\n'),
              ('              onClick={() => {\n                if (upiUrl) window.location.href = upiUrl;\n              }}', '              onClick={() => {\n                if (upiUrl) window.location.assign(upiUrl);\n              }}'),
              ('              <span>Open UPI app &amp; pay</span>', '              <span>Open UPI app &amp; pay</span>'),
          ])

          replace('src/components/payments/datebu-shop.tsx', [
              ('Direct UPI checkout · verified instantly before delivery', 'Direct UPI checkout · transaction reviewed before delivery'),
              ('DateBuShop.displayName = "DateBuShop";', 'DateBuShop.displayName = "ExtrovertShop";'),
          ])

          replace('src/app/(app)/app/discover/discover-client.tsx', [
              ('          {profile.identity_context || "DateBu member"}', '          {profile.identity_context || "Extrovert member"}'),
              ('{verified ? "Identity verified" : "Identity not verified"}', '{verified ? "Face verified" : "Face not verified"}'),
          ])

          replace('src/app/(app)/app/profile/view/[userId]/page.tsx', [
              ('export const metadata: Metadata = { title: "Profile | DateBu" };', 'export const metadata: Metadata = { title: "Profile | Extrovert" };'),
              ('label={identityVerified ? "Identity verified" : "Identity not verified"}', 'label={identityVerified ? "Face verified" : "Face not verified"}'),
              ('            DateBu\n', '            EXTROVERT\n'),
          ])

          replace('src/app/(app)/app/profile/page.tsx', [
              ('export const metadata: Metadata = { title: "Profile | DateBu" };', 'export const metadata: Metadata = { title: "Profile | Extrovert" };'),
              ('yes="Identity verified"\n              no="Identity not verified"', 'yes="Face verified"\n              no="Face not verified"'),
              ('              Identity verification\n', '              Face verification\n'),
              ('              {verified ? "Your identity is verified" : "Verify your identity"}', '              {verified ? "Your face verification is complete" : "Complete face verification"}'),
              ('                ? "Your official verification badge is visible on your profile."\n                : "Add the trust badge with a government ID check. This is optional and confidential."', '                ? "Your face verification badge is visible on your profile."\n                : "Complete the short live-camera check to add the face verification badge."'),
              ('              Identity details are managed in Profile Setup. Officially verified', '              Your identity details are managed in Profile Setup. Face verification is separate and does not require an ID document.'),
              ('clean(identity.display_name, "DateBu Member")', 'clean(identity.display_name, "Extrovert Member")'),
          ])

          # Keep the verification page wording aligned with the face-only verification model.
          replace('src/app/verification/page.tsx', [
              ('EXTROVERT · VERIFIED', 'EXTROVERT · FACE VERIFIED'),
              ('You&apos;re verified.', 'Your face is verified.'),
              ('              <p className="mt-2.5 text-xs leading-relaxed text-zinc-400 sm:text-sm">A short live-camera check confirms an authentic person is behind your account. No identity card or document is required.</p>', '              <p className="mt-2.5 text-xs leading-relaxed text-zinc-400 sm:text-sm">A short live-camera check confirms an authentic person is behind your account. No identity card or document is required.</p>'),
              ('Keep Extrovert authentic', 'Keep Extrovert authentic'),
              ('Quick face check', 'Quick face check'),
          ])

          # Add a unique payment reference to the UPI transaction note so app-launched payments
          # can be correlated with the exact payment request. Manual UPI payments still require UTR proof.
          p = Path('src/app/api/upi/create-order/route.ts')
          s = p.read_text()
          old = 'upiUrl: createUpiPaymentUrl({ amountPaise: config.amountPaise, note: `Extrovert ${config.label}` }),'
          new = 'upiUrl: createUpiPaymentUrl({ amountPaise: config.amountPaise, note: `Extrovert ${config.label} REF ${upiPaymentId.slice(0, 8)}` }),' 
          if old not in s:
              raise SystemExit('Missing expected UPI note line')
          p.write_text(s.replace(old, new))

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/fix-verification-upi.yml
          git commit -m "fix: separate face and area verification; repair UPI intent" || exit 0
          git rm .github/workflows/fix-verification-upi.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
