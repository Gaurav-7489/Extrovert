name: repair discover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix Discover and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(app)/app/discover/discover-client.tsx')
          s = p.read_text()
          s = s.replace('deck.slice(0, 2)', 'deck.slice(0, 1)')
          s = s.replace('New profiles will appear as the DateBu community grows.', 'New profiles will appear as the Extrovert community grows.')
          p.write_text(s)
          Path('.github/workflows/repair-discover.yml').unlink()
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/'(app)'/app/discover/discover-client.tsx .github/workflows/repair-discover.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: render one Discover profile and finish Extrovert branding"
          git push origin HEAD:main
