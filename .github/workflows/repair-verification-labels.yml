name: Repair verification labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair labels
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('src').rglob('*.tsx'):
              s=p.read_text()
              s=s.replace('Identity verified','Face verified').replace('Identity not verified','Face not verified')
              if p.as_posix().endswith('src/app/(app)/app/discover/discover-client.tsx'):
                  old='''          {area && (\n            <span className="inline-flex items-center gap-1 rounded-full border border-[#550000]/30 bg-[#550000]/90 px-2.5 py-1.5 text-[9px] font-black text-white shadow-lg backdrop-blur-xs">\n              <MapPin className="h-3 w-3" />\n              Area verified{profile.area_name ? ` · ${profile.area_name}` : ""}\n            </span>\n          )}'''
                  new='''          <span className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1.5 text-[9px] font-black shadow-lg backdrop-blur-xs ${area ? "border-[#550000]/30 bg-[#550000]/90 text-white" : "border-white/30 bg-black/45 text-white/75"}`}>\n            <MapPin className="h-3 w-3" />\n            {area ? `Area verified${profile.area_name ? ` · ${profile.area_name}` : ""}` : "Area not verified"}\n          </span>'''
                  s=s.replace(old,new)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: show face and area verification separately" || exit 0
          git push
