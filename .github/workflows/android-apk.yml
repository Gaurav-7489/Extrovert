name: Build Extrovert APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Production Extrovert URL (HTTPS)'
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_URL: ${{ inputs.app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor wrapper
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            // Keep the existing package id so previously installed test APKs can
            // continue to upgrade cleanly. The visible product name is Extrovert.
            appId: 'com.extrovert.date',
            appName: 'Extrovert',
            webDir: 'public',
            server: {
              url: process.env.APP_URL,
              cleartext: false,
            },
          };

          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: extrovert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
